<svg width="420" height="180" viewBox="0 0 420 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Card do projeto Perfil GitHub</title>
  <desc id="desc">Card escuro com destaque para Python, web e portfólio.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="420" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c93bff"/>
      <stop offset="0.55" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="shine" x1="-80" y1="0" x2="420" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-120 0; 160 0; -120 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="418" height="178" rx="10" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <rect x="18" y="18" width="384" height="144" rx="8" fill="#111827"/>
  <rect x="18" y="18" width="384" height="144" rx="8" fill="url(#shine)"/>
  <text x="34" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Perfil GitHub</text>
  <text x="34" y="84" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Python, web e identidade visual</text>
  <text x="34" y="118" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="15">status: em desenvolvimento</text>
  <g transform="translate(34 134)">
    <rect width="84" height="26" rx="13" fill="#2f80ed"/>
    <text x="42" y="18" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Python</text>
  </g>
  <g transform="translate(128 134)">
    <rect width="58" height="26" rx="13" fill="#c93bff"/>
    <text x="29" y="18" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web</text>
  </g>
  <g transform="translate(196 134)">
    <rect width="88" height="26" rx="13" fill="#334155"/>
    <text x="44" y="18" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Portfólio</text>
  </g>
  <text x="338" y="118" fill="#c93bff" font-family="Consolas, Monaco, monospace" font-size="28" font-weight="800">&lt;/&gt;</text>
</svg>
